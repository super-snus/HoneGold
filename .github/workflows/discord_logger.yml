name: github discord logger

on: [push]

jobs:
  discord-log:
    runs-on: ubuntu-latest
    steps:
      - name: send embed to discord
        run: |
          # 1. Сбор базовых данных
          AUTHOR="${{ github.actor }}"
          AVATAR="https://github.com{AUTHOR}.png"
          MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          
          # 2. Подсчет файлов
          COUNT_ADDED=$(echo '${{ toJson(github.event.head_commit.added) }}' | jq 'length')
          COUNT_MODIFIED=$(echo '${{ toJson(github.event.head_commit.modified) }}' | jq 'length')
          COUNT_REMOVED=$(echo '${{ toJson(github.event.head_commit.removed) }}' | jq 'length')

          # 3. Разделение коммита на заголовок и описание
          TITLE=$(echo "$MESSAGE" | head -n 1)
          DESC=$(echo "$MESSAGE" | tail -n +2)

          if [ ! -z "$DESC" ]; then
            DESC_BLOCK="description:\n\`\`\`\n${DESC}\n\`\`\`\n"
          else
            DESC_BLOCK=""
          fi

          STATS="**Статистика изменений:**\n🟢 Добавлено: \`$COUNT_ADDED\` файлов | 🟡 Изменено: \`$COUNT_MODIFIED\` файлов | 🔴 Удалено: \`$COUNT_REMOVED\` файла"
          FINAL_DESC="$DESC_BLOCK$STATS"

          # 4. Безопасное формирование JSON через jq (защита от кривых кавычек)
          jq -n \
            --arg title "$TITLE" \
            --arg desc "$FINAL_DESC" \
            --arg url "$COMMIT_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg avatar "$AVATAR" \
            --arg ts "$TIMESTAMP" \
            '{
              content: null,
              embeds: [
                {
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 3158064,
                  fields: [
                    { name: "repository", value: ("`" + $repo + "`"), inline: true },
                    { name: "branch", value: ("`" + $branch + "`"), inline: true }
                  ],
                  author: { name: $author, icon_url: $avatar },
                  timestamp: $ts
                }
              ],
              attachments: []
            }' > discord_payload.json

          # 5. Отправка готового файла в Discord
          curl -H "Content-Type: application/json" \
               -X POST \
               -d @discord_payload.json \
               ${{ secrets.MALASOLKA_DS_WEBHOOK }}
